name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test tests/BackloggdLogger.Core.Tests -c Release
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/BackloggdLogger -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -p:GenerateDocumentationFile=false -p:Version="${GITHUB_REF_NAME#v}" -o out
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Windows 10/11, x64. Self-contained, no install needed: run BackloggdLogger.exe."
          gh release upload "$GITHUB_REF_NAME" out/BackloggdLogger.exe --clobber
